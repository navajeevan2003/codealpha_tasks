<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="CodeAlpha Music Player">

    <title>CodeAlpha Music Player</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <main class="player-container">

        <section class="music-player" id="musicPlayer">

            <!-- HEADER -->
            <div class="player-header">

                <button
                    class="icon-btn"
                    id="menuBtn"
                    type="button"
                    aria-label="Playlist">
                    ☰
                </button>

                <h1>Music Player</h1>

                <button
                    class="icon-btn"
                    id="themeBtn"
                    type="button"
                    aria-label="Toggle theme">
                    ☀
                </button>

            </div>


            <!-- ALBUM -->
            <div class="album-section">

                <div class="album-art">

                    <img
                        id="cover"
                        src="./assets/images/song1.jpg"
                        alt="Album cover">

                </div>

                <div class="song-info">

                    <h2 id="title">Perfect</h2>

                    <p id="artist">Ed Sheeran</p>

                </div>

            </div>


            <!-- AUDIO -->
            <audio id="audio" preload="metadata"></audio>


            <!-- PROGRESS -->
            <div class="progress-section">

                <div class="time">

                    <span id="currentTime">
                        00:00
                    </span>

                    <span id="duration">
                        00:00
                    </span>

                </div>

                <input
                    type="range"
                    id="progress"
                    min="0"
                    max="100"
                    value="0"
                    step="0.1">

            </div>


            <!-- CONTROLS -->
            <div class="controls">

                <button
                    class="control-btn"
                    id="previousBtn"
                    type="button"
                    aria-label="Previous song">
                    ⏮
                </button>

                <button
                    class="play-btn"
                    id="playBtn"
                    type="button"
                    aria-label="Play">
                    ▶
                </button>

                <button
                    class="control-btn"
                    id="nextBtn"
                    type="button"
                    aria-label="Next song">
                    ⏭
                </button>

            </div>


            <!-- EXTRA CONTROLS -->
            <div class="extra-controls">

                <button
                    class="small-btn"
                    id="shuffleBtn"
                    type="button"
                    title="Shuffle">
                    🔀
                </button>

                <button
                    class="small-btn"
                    id="repeatBtn"
                    type="button"
                    title="Repeat">
                    🔁
                </button>

                <span id="playMode">
                    Normal
                </span>

            </div>


            <!-- VOLUME -->
            <div class="volume-section">

                <span id="volumeIcon">
                    🔊
                </span>

                <input
                    type="range"
                    id="volume"
                    min="0"
                    max="1"
                    step="0.01"
                    value="0.8">

            </div>


            <!-- PLAYLIST -->
            <div
                class="playlist"
                id="playlist">

                <div class="playlist-header">

                    <h3>Playlist</h3>

                    <span id="songCount">
                        3 Songs
                    </span>

                </div>

                <div id="playlistItems"></div>

            </div>

        </section>

    </main>


    <script src="./script.js"></script>

</body>
</html>
